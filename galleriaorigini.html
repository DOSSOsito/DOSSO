<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOSSO – galleria</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="img/logosemplificato.svg" type="image/png+xml">
</head>
<body class="galleria">

<main>
    <!-- GRIGLIA PRINCIPALE -->
    <section class="grid">
        <!-- Colonna 1: logo -->
        <div class="column">
            <a href="home.html" class="logo-link">
                <img src="img/logosemplificato.svg" alt="DOSSO" class="logo">
            </a>
        </div>

        <!-- Colonne centrali vuote -->
        <div class="column"></div>
        <div class="column"></div>
        <div class="column desktop-only"></div>
        <div class="column desktop-only"></div>
        <div class="column desktop-only"></div>

        <!-- Colonna ultra-wide extra -->
        <div class="column ultra-wide-only"></div>
        <div class="column ultra-wide-only"></div>

        <!-- Colonna 7: menu desktop -->
        <div class="column menu-column">
            <div class="menu-wrapper">
                <input type="checkbox" id="menu-toggle" class="menu-checkbox">
                <label for="menu-toggle" class="menu-toggle">
                    <img src="img/scalechiuso.svg" alt="Menu" class="menu-icon">
                </label>
                <div class="dropdown-menu">
                    <a href="lavori.html">lavori</a>
                    <a href="galleria.html" class="active">galleria</a>
                    <a href="attrezzatura.html">attrezzatura</a>
                    <a href="info.html">info</a>
                </div>
            </div>
        </div>
    </section>

    <!-- OVERLAY CENTRALE DESKTOP -->


<div class="overlay-central desktop-only">

    <div class="gallery-image-area">
        <img
    src="img/galleria/GL01.JPG"
    alt=""
    class="gallery-image"
>
</div>

<div class="overlay-grid">

<div class="overlay-column">
    <button class="gallery-arrow gallery-prev" aria-label="Foto precedente">
            <img src="img/frecciaprecedente.svg" alt="">
        </button></div>
<div class="overlay-column"></div>
<div class="overlay-column"></div>
<div class="overlay-column"></div>
<div class="overlay-column">
    <button class="gallery-arrow gallery-next" aria-label="Foto successiva">
            <img src="img/frecciasuccessivo.svg" alt="">
        </button></div>


</div>
</div>
</div>

    <!-- OVERLAY MOBILE -->
    <div class="overlay-central mobile-only">
        <div class="overlay-grid">
            <!-- Colonna 1: logo link -->
            <div class="overlay-column">
                <a href="home.html" class="logo-link">
                    <img src="img/logosemplificato.svg" alt="DOSSO" class="logo">
                </a>
            </div>

            <!-- Colonna 2 vuota -->
            <div class="overlay-column"></div>

            <!-- Colonna 3: menu mobile -->
            <div class="overlay-column menu-column">
                <div class="menu-wrapper">
                    <input type="checkbox" id="menu-toggle-mobile" class="menu-checkbox">
                    <label for="menu-toggle-mobile" class="menu-toggle">
                        <img src="img/scalechiuso.svg" alt="Menu" class="menu-icon">
                    </label>
                    <nav class="dropdown-menu">
                        <a href="lavori.html">lavori</a>
                    <a href="galleria.html" class="active">galleria</a>
                    <a href="attrezzatura.html">attrezzatura</a>
                    <a href="info.html">info</a>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- SFONDO -->
    <img src="img/Sfondo.jpg" alt="Sfondo" class="full-bg">

    <script src="galleriaorigini.js"></script>

    <script src="script.js"></script>

    <div class="grain"></div>
    
</main>

</body>
</html>
